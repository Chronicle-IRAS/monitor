limit_req_zone $binary_remote_addr zone=monitor_login:10m rate=5r/m;
server {
 listen 443 ssl http2;
 ssl_certificate /etc/letsencrypt/live/monitor.chronicleiras.top/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/monitor.chronicleiras.top/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_name monitor.chronicleiras.top;
 auth_basic "Chronicle Monitor";
 auth_basic_user_file /etc/nginx/monitor.htpasswd;
 root /srv/apps/monitor/current/dist;
 location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/letsencrypt; }
 location = /api/auth/login {
  limit_req zone=monitor_login burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:3100;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location /api/ {
  proxy_pass http://127.0.0.1:3100;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  add_header Cache-Control no-store always;
 }
 location ~ ^/video/(?<video_port>905[1-9]|90[6-9][0-9]|9100)(?<video_path>/stream|/mjpeg|/)$ {
  proxy_pass http://127.0.0.1:$video_port$video_path$is_args$args;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection upgrade;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
 }
 location /video/ { return 404; }
 location / { try_files $uri $uri/ /index.html; }
 location ~ /\. { deny all; }
 gzip on;
 gzip_types application/javascript text/css application/json;
 client_max_body_size 64k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
}

server {
 listen 80;
 server_name monitor.chronicleiras.top;
 location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/letsencrypt; }
 location / { return 301 https://monitor.chronicleiras.top$request_uri; }
}
